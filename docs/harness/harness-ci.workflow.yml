name: Harness CI

# Phase 6 — four-gate CI for the OS-Agent Harness.
#
# Gates run sequentially so failures stop the pipeline at the cheapest
# step possible. Each gate maps to a Phase docs/harness/* surface so
# operators can trace a CI failure to its design document.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-gate:
    name: "Gate 1 — Phase 0 contract"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Contract + required-events snapshot
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # No live server: the snapshot tests skip fields they can't reach
          # without the running service; the *static* asserts (golden file
          # exists, REQUIRED_NORMAL_EVENTS constant present in source)
          # still run and fail the gate on contract drift.
          pytest tests/test_os_agent_contract_snapshot.py \
                 tests/test_required_events_snapshot.py -q

  runtime-gate:
    name: "Gate 2 — Phase 1 runtime"
    needs: contract-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: LocalRuntime + tool profiles
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/test_local_runtime_contract.py \
                 tests/test_tool_profiles.py \
                 tests/test_cli_stdio_local_runtime.py -q

  delayed-validation-gate:
    name: "Gate 3 — Phase 2/3/4 skill + validation + research"
    needs: runtime-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: SkillRepo v2 + Curator + Validator + ExternalCrawler
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/test_skill_repo_v2.py \
                 tests/test_skill_signature_and_duplicate.py \
                 tests/test_curator_candidate_pipeline.py \
                 tests/test_delayed_validation_ab.py \
                 tests/test_external_crawler_connectors.py \
                 tests/test_indexer_bm25_and_dedupe.py -q

  observer-evidence-gate:
    name: "Gate 4 — Phase 5/6 observer + harness governance"
    needs: delayed-validation-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Observer + harness end-to-end
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/test_observer_impact_compare.py \
                 tests/test_harness_end_to_end.py \
                 tests/test_review_gate_and_rollback.py -q
